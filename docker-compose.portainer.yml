# Portainer-anpassad compose-fil för StockAlerts (hemnätverk, utan Tailscale).
# Läggs i roten av din fork bredvid originalets docker-compose.yml.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockalerts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-stockalerts}
    # Ingen ports-rad: databasen nås bara inifrån stacken
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockalerts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockalerts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockalerts}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      BACKEND_MAIL_HOST: ${BACKEND_MAIL_HOST:-smtp.gmail.com}
      BACKEND_MAIL_PORT: ${BACKEND_MAIL_PORT:-465}
      BACKEND_MAIL_USERNAME: ${BACKEND_MAIL_USERNAME:-}
      BACKEND_MAIL_EMAIL: ${BACKEND_MAIL_EMAIL:-}
      BACKEND_MAIL_PASSWORD: ${BACKEND_MAIL_PASSWORD:-}
      TZ: ${TZ:-Europe/Stockholm}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Kör worker.run (en körning per gång) i en loop med timeout, i stället
    # för den inbyggda loopen som kan hänga sig tyst vid ett hängande yfinance-anrop.
    command:
      - sh
      - -c
      - |
        while true; do
          timeout ${WORKER_RUN_TIMEOUT:-600} uv run --no-dev python -m worker.run
          echo "worker.run avslutades med kod $$? – nästa körning om ${WORKER_INTERVAL_SECONDS:-900} s"
          sleep ${WORKER_INTERVAL_SECONDS:-900}
        done
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockalerts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockalerts}?schema=public
      WORKER_PRICE_HISTORY_PERIOD: ${WORKER_PRICE_HISTORY_PERIOD:-1y}
      WORKER_FINNHUB_API_KEY: ${WORKER_FINNHUB_API_KEY:-}
      WORKER_FINNHUB_HISTORY_ENABLED: ${WORKER_FINNHUB_HISTORY_ENABLED:-false}
      WORKER_FINNHUB_BASE_URL: ${WORKER_FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      WORKER_MAIL_HOST: ${WORKER_MAIL_HOST:-smtp.gmail.com}
      WORKER_MAIL_PORT: ${WORKER_MAIL_PORT:-465}
      WORKER_MAIL_USERNAME: ${WORKER_MAIL_USERNAME:-}
      WORKER_MAIL_EMAIL: ${WORKER_MAIL_EMAIL:-}
      WORKER_MAIL_PASSWORD: ${WORKER_MAIL_PASSWORD:-}
      WORKER_TELEGRAM_BOT_TOKEN: ${WORKER_TELEGRAM_BOT_TOKEN:-}
      WORKER_TELEGRAM_API_BASE_URL: ${WORKER_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TZ: ${TZ:-Europe/Stockholm}

  frontend:
    build:
      context: ./frontend
      args:
        # Bakas in vid bygget – måste vara serverns IP, inte localhost
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
